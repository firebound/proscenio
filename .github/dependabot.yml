# Dependabot keeps dependencies and the SHA-pinned Actions fresh.
#
# The workflows pin every `uses:` to a full commit SHA (the defense against
# a moved tag pointing at malicious code). Pinning freezes them, so the
# `github-actions` ecosystem below is what bumps the pin + its version comment
# when a new release lands - keeping the safety of pinning without the rot.
#
# npm covers all three pnpm projects (the ecosystem reads pnpm-lock.yaml);
# uv covers the Python workspace (root uv.lock spans every member).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/apps/photoshop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      photoshop-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/apps/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      docs-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/tools/qa-companion"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      qa-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
