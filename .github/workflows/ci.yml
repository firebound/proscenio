name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - name: Ruff lint
        run: uvx ruff check apps/blender/
      - name: Ruff format check
        run: uvx ruff format --check apps/blender/
      - name: Sync uv workspace
        run: uv sync --all-packages
      # Run from the repo root (not `cd apps/blender`). The addon's mypy
      # config roots the package tree at `apps/` (mypy_path =
      # ${MYPY_CONFIG_FILE_DIR}/..) so the addon is the package `blender`
      # and its relative `core` imports resolve at the same depth Blender
      # mounts them. mypy only honours that base when CWD is not the
      # config dir itself - from `apps/blender` it falls back to a
      # CWD-relative base (`core.*`) and the import resolution breaks.
      - name: Mypy strict (apps/blender)
        run: uv run --with mypy mypy --config-file apps/blender/pyproject.toml
      - name: Mypy strict (packages/validator)
        run: uv run --with mypy mypy --config-file packages/validator/pyproject.toml
      - name: Mypy strict (packages/models)
        run: uv run --with mypy mypy --config-file packages/models/pyproject.toml
      - name: Mypy strict (packages/codegen)
        run: uv run --with mypy mypy --config-file packages/codegen/pyproject.toml
      - name: Pytest (validation unit tests, no Blender)
        run: uv run pytest tests/

  lint-photoshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9
      - name: Install
        working-directory: apps/photoshop
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/photoshop
        run: pnpm run typecheck
      - name: Lint
        working-directory: apps/photoshop
        run: pnpm run lint
      - name: Unit tests
        working-directory: apps/photoshop
        run: pnpm test

  lint-gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install gdtoolkit
      - run: gdformat --check apps/godot/addons/proscenio/
      - run: gdlint apps/godot/addons/proscenio/

  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install check-jsonschema
      - name: Validate .proscenio fixtures
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(examples/**/*.proscenio apps/godot/tests/fixtures/**/*.proscenio apps/blender/tests/fixtures/**/*.proscenio)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .proscenio files yet - skipping."
            exit 0
          fi
          check-jsonschema --schemafile packages/models/schemas/proscenio.schema.json "${files[@]}"
      - name: Validate PSD manifest fixtures
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(examples/**/*.photoshop_manifest.json examples/**/*.photoshop_exported.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PSD manifest fixtures yet - skipping."
            exit 0
          fi
          check-jsonschema --schemafile packages/models/schemas/psd_manifest.schema.json "${files[@]}"

  test-blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/blender
          key: blender-5.1.1-linux-x64
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fL "https://download.blender.org/release/Blender5.1/blender-5.1.1-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1
      - name: Install bundled wheels into Blender's Python
        # Mirrors the runtime flow that Blender's extension installer
        # uses for the wheels block in blender_manifest.toml. We feed
        # pip the local wheel cache via --find-links + --no-index so
        # the install resolves entirely from apps/blender/wheels/ and
        # picks the right linux x86_64 pydantic-core wheel.
        run: |
          ~/blender/blender --background --python-expr "
          import ensurepip; ensurepip.bootstrap()
          import subprocess, sys
          subprocess.check_call([
              sys.executable, '-m', 'pip', 'install', '--no-index',
              '--find-links', 'apps/blender/wheels/',
              'pydantic', 'proscenio-models',
          ])
          "
      - name: Re-export every fixture and diff against goldens
        run: |
          ~/blender/blender --background \
            --python apps/blender/tests/run_tests.py
      - name: Validate automesh (per-pixel coverage + hole bleed, ci-safe sprites only)
        run: |
          ~/blender/blender --background \
            --python packages/validator/scripts/validate_automesh.py \
            -- --ci-only
      - name: Install pytest into Blender's bundled Python
        run: |
          ~/blender/blender --background --python-expr "import ensurepip; ensurepip.bootstrap(); import subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pytest'])"
      - name: Headless operator tests
        run: |
          ~/blender/blender --background \
            --python apps/blender/tests/run_operator_tests.py

  test-godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/godot
          key: godot-4.6.2-stable-linux-x86_64
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fLo /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          unzip /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v4.6.2-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Sync baked fixtures into the dev project
        # apps/godot/examples/ is gitignored (derived); populate it from the
        # committed examples/generated/**/*.expected.proscenio goldens so the
        # importer + test_golden_scenes.gd walk the real baked output.
        run: python scripts/godot/sync_fixtures.py
      - name: Prime Godot class_name cache
        # The test_importer.gd script and the schema_bindings/ Resources
        # reference each other via class_name. The cache that maps those
        # global names to file paths is only populated when Godot opens
        # the project once; without it, the script parse errors out with
        # "Could not resolve external class member". Run a quick headless
        # editor pass to trigger the scan, then quit.
        run: |
          ~/godot/godot --headless --path apps/godot --editor --quit 2>&1
      - name: Run importer smoke test
        run: |
          ~/godot/godot --headless --path apps/godot \
            --script res://tests/test_importer.gd
      - name: Run sprite-region test
        run: |
          ~/godot/godot --headless --path apps/godot \
            --script res://tests/test_sprite_region.gd
      - name: Run slot-anchor test
        run: |
          ~/godot/godot --headless --path apps/godot \
            --script res://tests/test_slot_anchor.gd
      - name: Run golden-scenes walk
        run: |
          ~/godot/godot --headless --path apps/godot \
            --script res://tests/test_golden_scenes.gd
