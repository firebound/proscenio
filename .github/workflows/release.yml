name: Release

on:
  push:
    tags:
      # One lockstep product tag builds all three app bundles. The retired
      # per-component prefixes (blender-v* / godot-v* / photoshop-v*) are gone.
      - "v*"
  # Tagless dry-run: exercise every package step without uploading a release.
  # The photoshop bundle rotted unnoticed precisely because packaging only ever
  # ran on tags; a dispatch path keeps all three builds exercisable.
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the artifact names (dry-run, no upload)"
        required: false
        default: "0.0.0-dry-run"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: meta
        # Route the dispatch input through an env var rather than expanding
        # `${{ inputs.* }}` straight into the script body: it is free text, so a
        # direct expansion is a shell-injection vector.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            # The tag is authoritative for the artifact name, but it must agree
            # with the committed VERSION (which drives every in-bundle manifest
            # via scripts/maintenance/sync_version.py). A mismatch means the
            # release would ship manifests that disagree with the tag - fail
            # loudly instead.
            expected="$(cat VERSION)"
            if [ "$version" != "$expected" ]; then
              echo "::error::tag version '$version' != VERSION file '$expected'; run scripts/maintenance/sync_version.py and retag" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The photoshop artifact is the built UXP bundle, not a source file.
      # apps/photoshop/dist/ is gitignored, so the job builds it here.
      - name: Set up Node (photoshop)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up pnpm (photoshop)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9
      - name: Build the UXP plugin (photoshop)
        working-directory: apps/photoshop
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/blender
          key: blender-5.1.1-linux-x64
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fL "https://download.blender.org/release/Blender5.1/blender-5.1.1-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Build the Blender extension
        # Package the add-on the way Blender's installer expects: validate the
        # manifest, then `extension build` (honours the [build] excludes in
        # blender_manifest.toml and bundles the wheels block). Replaces the old
        # raw `zip`, which shipped an unvalidated tree and could not catch a
        # malformed manifest before release.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          ~/blender/blender --factory-startup --command extension validate apps/blender
          ~/blender/blender --factory-startup --command extension build \
            --source-dir apps/blender \
            --output-filepath "dist/proscenio-blender-$VERSION.zip"

      - name: Build the Godot and Photoshop artifacts
        # Same defense as the meta step: the version rides an env var, never a
        # `${{ }}` expansion inside the script body.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          (cd apps/godot && zip -r "../../dist/proscenio-godot-$VERSION.zip" addons/proscenio)
          # The UXP plugin root is dist/ itself - manifest.json lands there
          # after the webpack build - so archive its contents, keeping
          # manifest.json at the zip root for the host loader.
          (cd apps/photoshop/dist && zip -r "../../../dist/proscenio-photoshop-$VERSION.zip" .)
          # A self-distributed .ccx is the plugin bundle zipped (manifest.json at
          # the root): the same archive as the .zip with the extension Photoshop's
          # installer recognizes on double-click (it prompts untrusted-developer
          # for an unsigned plugin). Marketplace-trusted signing needs Adobe
          # Exchange and cannot run in CI, so ship the zip-equivalent .ccx.
          cp "dist/proscenio-photoshop-$VERSION.zip" "dist/proscenio-photoshop-$VERSION.ccx"

      - name: List artifact contents
        # A .ccx is a zip under the hood, so unzip -l lists it too. Glob both
        # extensions so the photoshop .ccx is verified alongside the zips.
        run: |
          for f in dist/*.zip dist/*.ccx; do
            [ -e "$f" ] || continue
            echo "== $f =="
            unzip -l "$f"
          done

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: github.event_name == 'push'
        with:
          files: dist/*
          # A pre-release tag carries a suffix (v0.9.0-beta, v1.0.0-rc1); a
          # final release (v1.0.0) does not. Keep betas out of "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
