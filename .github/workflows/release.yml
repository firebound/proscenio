name: Release

on:
  push:
    tags:
      # One lockstep product tag builds all three app bundles. The retired
      # per-component prefixes (blender-v* / godot-v* / photoshop-v*) are gone.
      - "v*"
  # Tagless dry-run: exercise every package step without uploading a release.
  # The photoshop bundle rotted unnoticed precisely because packaging only ever
  # ran on tags; a dispatch path keeps all three builds exercisable.
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the artifact names (dry-run, no upload)"
        required: false
        default: "0.0.0-dry-run"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Determine version
        id: meta
        # Route the dispatch input through an env var rather than expanding
        # `${{ inputs.* }}` straight into the script body: it is free text, so a
        # direct expansion is a shell-injection vector.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The photoshop artifact is the built UXP bundle, not a source file.
      # apps/photoshop/dist/ is gitignored, so the job builds it here.
      - name: Set up Node (photoshop)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Set up pnpm (photoshop)
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9
      - name: Build the UXP plugin (photoshop)
        working-directory: apps/photoshop
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build all three artifacts
        # Same defense as the meta step: the version rides an env var, never a
        # `${{ }}` expansion inside the script body.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          (cd apps/blender && zip -r "../../dist/proscenio-blender-$VERSION.zip" . -x "tests/*" "pyproject.toml" "README.md")
          (cd apps/godot && zip -r "../../dist/proscenio-godot-$VERSION.zip" addons/proscenio)
          # The UXP plugin root is dist/ itself - manifest.json lands there
          # after the webpack build - so archive its contents, keeping
          # manifest.json at the zip root for the host loader.
          (cd apps/photoshop/dist && zip -r "../../../dist/proscenio-photoshop-$VERSION.zip" .)
          # A self-distributed .ccx is the plugin bundle zipped (manifest.json at
          # the root): the same archive as the .zip with the extension Photoshop's
          # installer recognizes on double-click (it prompts untrusted-developer
          # for an unsigned plugin). Marketplace-trusted signing needs Adobe
          # Exchange and cannot run in CI, so ship the zip-equivalent .ccx.
          cp "dist/proscenio-photoshop-$VERSION.zip" "dist/proscenio-photoshop-$VERSION.ccx"

      - name: List artifact contents
        # A .ccx is a zip under the hood, so unzip -l lists it too. Glob both
        # extensions so the photoshop .ccx is verified alongside the zips.
        run: |
          for f in dist/*.zip dist/*.ccx; do
            [ -e "$f" ] || continue
            echo "== $f =="
            unzip -l "$f"
          done

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: github.event_name == 'push'
        with:
          files: dist/*
          # A pre-release tag carries a suffix (v0.9.0-beta, v1.0.0-rc1); a
          # final release (v1.0.0) does not. Keep betas out of "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
