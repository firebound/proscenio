name: Release

on:
  push:
    tags:
      # One lockstep product tag builds all three app bundles. The retired
      # per-component prefixes (blender-v* / godot-v* / photoshop-v*) are gone.
      - "v*"
  # Tagless dry-run: exercise every package step without uploading a release.
  # The photoshop bundle rotted unnoticed precisely because packaging only ever
  # ran on tags; a dispatch path keeps all three builds exercisable.
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the artifact names (dry-run, no upload)"
        required: false
        default: "0.0.0-dry-run"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine version
        id: meta
        # Route the dispatch input through an env var rather than expanding
        # `${{ inputs.* }}` straight into the script body: it is free text, so a
        # direct expansion is a shell-injection vector.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The photoshop artifact is the built UXP bundle, not a source file.
      # apps/photoshop/dist/ is gitignored, so the job builds it here.
      - name: Set up Node (photoshop)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Set up pnpm (photoshop)
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9
      - name: Build the UXP plugin (photoshop)
        working-directory: apps/photoshop
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Package the built UXP bundle into an Adobe .ccx for end users (the .zip
      # above stays for UDT / dev loading). Caveats worth knowing if this breaks:
      #   - `npm install -g @adobe/uxp-devtools-cli` is "not officially
      #     supported" per Adobe's README, so we invoke it through npx as a
      #     best-effort path. If npx stops resolving the package in CI, fall back
      #     to downloading the prebuilt binary from
      #     github.com/adobe-uxp/devtools-cli/releases and calling it directly.
      #   - The produced .ccx is self-distributed: it installs via double-click
      #     but Photoshop shows an untrusted / developer prompt. Marketplace-
      #     trusted signing requires submitting to Adobe Exchange and cannot be
      #     done in CI.
      # The CLI names the output after the manifest plugin id/version, so we glob
      # for the produced *.ccx and rename it to a stable asset name. The step
      # fails loudly (set -e plus an explicit check) rather than silently
      # skipping if packaging produced nothing. All paths are absolute via
      # $GITHUB_WORKSPACE: the CLI's --outputPath resolution (relative to cwd vs
      # manifest) is unverified, so absolute paths remove the ambiguity entirely.
      - name: Package the UXP plugin as .ccx (photoshop)
        working-directory: apps/photoshop
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npx --yes @adobe/uxp-devtools-cli uxp plugin package \
            --manifest dist --apps PS --outputPath "$GITHUB_WORKSPACE/dist"
          produced="$(ls "$GITHUB_WORKSPACE"/dist/*.ccx | head -n 1)"
          if [ -z "$produced" ]; then
            echo "No .ccx was produced by the UXP devtools CLI" >&2
            exit 1
          fi
          mv "$produced" "$GITHUB_WORKSPACE/dist/proscenio-photoshop-$VERSION.ccx"

      - name: Build all three artifacts
        # Same defense as the meta step: the version rides an env var, never a
        # `${{ }}` expansion inside the script body.
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          (cd apps/blender && zip -r "../../dist/proscenio-blender-$VERSION.zip" . -x "tests/*" "pyproject.toml" "README.md")
          (cd apps/godot && zip -r "../../dist/proscenio-godot-$VERSION.zip" addons/proscenio)
          # The UXP plugin root is dist/ itself - manifest.json lands there
          # after the webpack build - so archive its contents, keeping
          # manifest.json at the zip root for the host loader.
          (cd apps/photoshop/dist && zip -r "../../../dist/proscenio-photoshop-$VERSION.zip" .)

      - name: List artifact contents
        # A .ccx is a zip under the hood, so unzip -l lists it too. Glob both
        # extensions so the photoshop .ccx is verified alongside the zips.
        run: |
          for f in dist/*.zip dist/*.ccx; do
            [ -e "$f" ] || continue
            echo "== $f =="
            unzip -l "$f"
          done

      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        if: github.event_name == 'push'
        with:
          files: dist/*
          # A pre-release tag carries a suffix (v0.9.0-beta, v1.0.0-rc1); a
          # final release (v1.0.0) does not. Keep betas out of "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
