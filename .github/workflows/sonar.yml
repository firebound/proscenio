name: SonarCloud

# CI-based SonarCloud analysis (Route B of spec 063). Replaces Automatic
# Analysis - the two modes cannot both run, so Automatic Analysis is disabled
# in the SonarCloud UI (Project Settings > Analysis Method). Generates the
# Python (pytest) and JavaScript (vitest) coverage the quality gate's
# new-code-coverage condition needs; the in-Blender coverage pass that lifts
# the bpy-bound writer/exporter lines (see sonar-project.properties) is a
# later enhancement for overall coverage and is not required by the gate.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    # Dependabot PRs run in the Dependabot context, which does NOT expose
    # Actions secrets - SONAR_TOKEN comes through empty and the scanner exits 3
    # ("Not authorized"), painting a false CI failure on dependency bumps. A
    # dependency-only PR has no source delta for the analyzer anyway, so skip
    # the scan for Dependabot; real-code PRs and pushes to main still run it.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scanner can attribute issues to their commits.
          fetch-depth: 0
          # Read-only scan; do not leave the token in the local git config.
          persist-credentials: false

      # --- Python coverage (pure-pytest pass) ---
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync uv workspace
        run: uv sync --all-packages --all-groups
      - name: Python coverage
        run: uv run pytest tests/ --cov=apps/blender --cov=packages --cov=scripts --cov-report=xml:coverage.xml

      # --- JavaScript/TypeScript coverage + types for the analyzer ---
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - name: Install Photoshop deps
        working-directory: apps/photoshop
        # --ignore-scripts: only the resolved node_modules tree is needed (for
        # the coverage run and for the TypeScript analyzer to resolve configs);
        # do not run package lifecycle scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Photoshop coverage
        working-directory: apps/photoshop
        run: pnpm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
