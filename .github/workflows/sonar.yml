name: SonarCloud

# CI-based SonarCloud analysis (Route B of spec 063). Replaces Automatic
# Analysis - the two modes cannot both run, so Automatic Analysis is disabled
# in the SonarCloud UI (Project Settings > Analysis Method). Coverage wiring
# (the in-Blender + pytest + vitest reports the properties already point at)
# lands in a follow-up; this job makes the CI-based analysis live with the
# correct project key and organization.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the scanner can attribute issues to their commits.
          fetch-depth: 0
          # Read-only scan; do not leave the token in the local git config.
          persist-credentials: false
      # Install the Photoshop deps so the TypeScript analyzer can resolve the
      # project's types and configs (without node_modules it warns that a
      # referenced/extended tsconfig is missing).
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9
      - name: Install Photoshop deps
        working-directory: apps/photoshop
        # --ignore-scripts: only the resolved node_modules tree is needed for
        # the TypeScript analysis; do not run package lifecycle scripts.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
