<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Proscenio QA Companion</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>QA Companion</h1>
  <nav class="tabs">
    <button id="tabTests" class="tab on">Tests</button>
    <button id="tabFeedback" class="tab">Feedback</button>
  </nav>
  <span id="modeChip" class="chip live">writing to .md</span>
  <span class="grow"></span>
  <div class="progress">
    <span id="progText">0/0</span>
    <span class="bar" id="bar"></span>
  </div>
</header>
<main>
  <aside>
    <div class="filters">
      <input type="text" id="search" placeholder="filter id / title / observe / note..." />
      <div class="row" id="appFilters"></div>
      <div class="row">
        <select id="statusFilter">
          <option value="">all status</option>
          <option value="__not-done">not done</option>
          <option value="__done">done</option>
        </select>
        <select id="reviewFilter">
          <option value="">all review</option>
        </select>
        <span class="grow"></span>
        <span id="countChip" class="chip">0</span>
      </div>
    </div>
    <div class="tree" id="tree"></div>
  </aside>
  <section class="card" id="card"><div class="empty">Loading...</div></section>
  <section class="feedback-view" id="feedbackView" hidden></section>
</main>
<div id="modal" class="modal-overlay" hidden>
  <div class="modal">
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk">OK</button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
